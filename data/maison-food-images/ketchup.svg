<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#faf9f7"/>
    </linearGradient>
    <radialGradient id="sphere" cx="35%" cy="30%" r="65%">
      <stop offset="0%" style="stop-color:#F8F2E8"/>
      <stop offset="45%" style="stop-color:#D4B87E"/>
      <stop offset="100%" style="stop-color:#E8D4B8"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feOffset dy="12" result="offset"/>
      <feComponentTransfer in="offset" result="shadow">
        <feFuncA type="linear" slope="0.15"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <g transform="translate(200 210) rotate(6) scale(0.98)" filter="url(#soft)">
    <ellipse cx="0" cy="20" rx="95" ry="28" fill="#E8D4B8" opacity="0.25"/>
    <circle cx="0" cy="-10" r="88" fill="url(#sphere)"/>
    <ellipse cx="-22" cy="-38" rx="28" ry="18" fill="white" opacity="0.35"/>
    <text x="0" y="8" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="42" font-weight="600" fill="white" opacity="0.9">K</text>
  </g>
  <text x="200" y="360" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="500" fill="#3d3a36">Ketchup</text>
</svg>